name: Generate actual mastering waveform SVG assets (draft only)
on:
  push:
    branches:
      - draft/abx-shared-framework-20261116
    paths:
      - scripts/generate-mastering-waveforms.py
      - .github/workflows/mastering-static-waveforms.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mastering-waveform-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check FLAC decoding utilities
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
      - name: Decode published FLAC files once and generate the SVGs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-mastering-waveforms.py
      - name: Verify real source provenance and small output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('assets/waveforms')
          m=json.loads((root/'mastering-provenance.json').read_text())
          assert len(m['sources'])==3
          for item in m['sources'].values():
              asset=pathlib.Path(item['svg'].lstrip('/'))
              assert asset.exists() and 1000<asset.stat().st_size<25000,(asset,asset.stat().st_size)
              assert len(item['sha256'])==64 and len(item['svg_sha256'])==64
          assert m['method'].startswith('180 stereo')
          print('SVG SOURCE/DELIVERY GATE PASSED')
          PY
      - name: Commit reviewed-size previews to the same draft branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/waveforms/mastering-*.svg assets/waveforms/mastering-provenance.json
          if git diff --cached --quiet; then
            echo "Static waveform previews already current"
          else
            git commit -m "[CF-Pages-Skip] Cache actual mastering waveform shapes as tiny static SVGs"
            git push origin HEAD:refs/heads/draft/abx-shared-framework-20261116
          fi
