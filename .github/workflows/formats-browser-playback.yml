name: Listening Labs browser playback and ABX smoke
on:
  pull_request:
    branches:
      - main
    paths:
      - lab/**
      - labs/**
      - assets/abx-lab.js
      - assets/abx-lab.css
      - assets/lab-readiness.js
      - assets/lab-readiness.css
      - assets/format-comparison-engine.js
      - assets/community-board.js
      - assets/community-board.css
      - assets/waveforms/**
      - workers/abx/**
      - tests/formats-browser-playback.smoke.mjs
      - tests/abx-scored-browser.mock.mjs
      - .github/workflows/formats-browser-playback.yml
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation without changing project dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Test full audio playback, readiness, community UI and mock scored ABX
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tsq-formats-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          timeout 200s node tests/formats-browser-playback.smoke.mjs
          timeout 75s node tests/abx-scored-browser.mock.mjs
