name: System Builder preview checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "system-builder/**"
      - "system-check/gear.js"
      - "system-check/compare/specs.js"
      - "tests/**"
      - ".github/workflows/system-builder-preview-tests.yml"

concurrency:
  group: system-builder-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-tests:
    name: Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend module syntax
        run: |
          for file in system-builder/*.mjs; do
            node --check "$file"
          done
      - name: Run all site tests
        run: node --test tests/*.test.mjs
