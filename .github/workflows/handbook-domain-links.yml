name: One-time TSQ handbook .com link migration

# One-time migration completed: retain manual audit pathway only.
# Its SHA guard refuses any later, nonoriginal handbook.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-approved-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: draft/abx-shared-framework-20261116
          persist-credentials: true
      - name: Prepare PDF editing environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified PDF tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-lato
          python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Replace only domain-specific PDF links and footer
        run: |
          python scripts/retarget-handbook-domain.py library/make-audio-make-sense/make-audio-make-sense-illustrated.pdf /tmp/tsq-handbook-domain.pdf
          mv /tmp/tsq-handbook-domain.pdf library/make-audio-make-sense/make-audio-make-sense-illustrated.pdf
      - name: Save reviewed handbook and its exact release SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/make-audio-make-sense/make-audio-make-sense-illustrated.pdf scripts/build-public-site.mjs tests/handbook-illustrated-release.test.mjs
          if git diff --cached --quiet; then
            echo "No changed PDF to commit"
            exit 0
          fi
          git commit -m "Retarget approved handbook PDF links and printed URL to .com"
          git push origin HEAD:refs/heads/draft/abx-shared-framework-20261116
