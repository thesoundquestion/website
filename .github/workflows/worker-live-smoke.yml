name: TSQ production Worker API smoke (no external secrets)

on:
  push:
    branches:
      - draft/abx-shared-framework-20261116
    paths:
      - tests/live-worker-api-smoke.py
      - .github/workflows/worker-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECT_OPEN: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test live Cloudflare Worker without exposing keys
        run: python3 tests/live-worker-api-smoke.py
