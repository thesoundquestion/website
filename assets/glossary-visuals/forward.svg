<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="title desc"><title id="title">Forward presentation</title><desc id="desc">Conceptual stereo listening room with the same couch and two speakers. Ghost musicians' spatial placement illustrates forward presentation; not a real measurement or literal visual source.</desc><defs>
