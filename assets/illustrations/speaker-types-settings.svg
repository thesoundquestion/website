<title id="t">Three different loudspeaker jobs: desk, living room and small venue</title><desc id="d">Three equal conceptual panels with dimensionally shaded loudspeakers and listeners. A nearfield desk has two compact speakers serving one chair. A living room has two home speakers facing a couch with several seats. A small venue has two elevated PA speakers serving an audience. The pale cyan areas identify intended listening zones, not measured sound coverage.</desc>
