 height="86" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M1001 151H1140" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="1071" y="178" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">HEADPHONES</text><text x="1071" y="202" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">Hear the playback</text><rect x="1006" y="220" width="130" height="4" rx="2" fill="#f4c48b" opacity=".8"/><rect x="22" y="277" width="1136" height="209" rx="16" fill="#0e2436" stroke="#3f647e"/><text x="39" y="307" fill="#f4cb99" font-size="17" font-weight="750" text-anchor="start">02 / A LIVE MIXER</text><rect x="42" y="340" width="126" height="85" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M55 345H154" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="105" y="372" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">VOCAL MIC</text><text x="105" y="396" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">Singer</text><rect x="60" y="413" width="90" height="4" rx="2" fill="#7ed7f8" opacity=".8"/><path d="M169 379L513 379" fill="none" stroke="#75d5fa" stroke-width="3" stroke-dasharray="4 5"/><path d="M504 373L513 379L504 385" stroke="#75d5fa" fill="none" stroke-width="3" stroke-linejoin="round"/><rect x="195" y="340" width="126" height="85" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M208 345H307" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="258" y="372" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">GUITAR</text><text x="258" y="396" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">Instrument</text><rect x="213" y="413" width="90" height="4" rx="2" fill="#97ddc1" opacity=".8"/><path d="M322 379L513 379" fill="none" stroke="#75d5fa" stroke-width="3" stroke-dasharray="4 5"/><path d="M504 373L513 379L504 3