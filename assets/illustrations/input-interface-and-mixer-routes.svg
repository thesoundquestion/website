 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#8be4ff"/><stop offset="1" stop-color="#2e98cf"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#789fbc" stroke-opacity=".10"/></pattern>
