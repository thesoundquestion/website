<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Two different sound jobs: recording interface and live mixing</title><desc id="figdesc">Top: voice through microphone preamp and analogue-to-digital conversion into a computer track, with a digital-to-analogue return to headphones. Bottom: three live sources pass through a mixer to the audience and a separate performer-monitor mix. Typical simplified paths, not a specific device or measured timing.</desc>
