troke="#f4c48b" fill="none" stroke-width="3" stroke-linejoin="round"/><rect x="811" y="311" width="313" height="90" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M824 316H1110" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="967.5" y="343" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">MAIN MIX</text><text x="967.5" y="367" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">Audience speakers / recorder</text><rect x="829" y="389" width="277" height="4" rx="2" fill="#78d9fb" opacity=".8"/><rect x="811" y="409" width="313" height="63" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M824 414H1110" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="967.5" y="441" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">AUX MIX</text><text x="967.5" y="465" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">Performer monitors</text><rect x="829" y="460" width="277" height="4" rx="2" fill="#f4c48b" opacity=".8"/><text x="40" y="504" fill="#b5ccdf" font-size="13" font-weight="500" text-anchor="start">CONCEPTUAL FLOW • Routes, sockets and built-in features differ by model.</text></g></svg>