<title id="t">Three ways microphones turn sound into electricity</title><desc id="d">Three conceptual cutaways: a dynamic (moving-coil) microphone with a diaphragm linked to a coil near a magnet, a condenser's charged diaphragm and backplate separated by a narrow gap, and a ribbon of thin metal suspended between magnets. All parts are simplified and not to scale.</desc>
