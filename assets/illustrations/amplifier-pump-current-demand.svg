<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Why lower speaker impedance can demand more amplifier current</title><desc id="desc">With the same target pressure or voltage, a wide bathtub tap represents a low impedance load requesting more flow than a pump can supply, unlike a narrow sink tap. The example pump has a fictional 1.5 amp maximum at that pressure.</desc>
<defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#1c3b50" fill="none"/></pattern><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#99d5eb"/><stop offset=".35" stop-color="#246387"/><stop offset=".67" stop-color="#0a3450"/><stop offset="1" stop-color="#85bfd3"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b6f5ff"/><stop offset=".5" stop-color="#30bdeb"/><stop offset="1" stop-color="#126d9b"/></linearGradient><linearGradient id="pipe" x2="0" y2="1"><stop stop-color="#9ceafa"/><stop offset=".23" stop-color="#2ebde6"/><stop offset=".7" stop-color="#08476d"/><stop offset="1" stop-color="#6fe4ff"/></linearGradient><symbol id="pump" viewBox="0 0 240 170"><rect x="20" y="145" width="200" height="20" rx="5" fill="url(#metal)" stroke="#a2e6f7"/><rect x="30" y="22" width="140" height="129" rx="18" fill="url(#metal)" stroke="#77d3ed" stroke-width="3"/><rect x="52" y="4" width="90" height="23" rx="7" fill="url(#metal)" stroke="#70cee8"/><ellipse cx="182" cy="87" rx="38" ry="58" fill="url(#metal)" stroke="#92e4ff" stroke-width="3"/><ellipse cx="182" cy="87" rx="22" ry="36" fill="#10354b" stroke="#9eecff" stroke-width="2"/><rect x="40" y="57" width="119" height="57" rx="7" fill="#092239" stroke="#6dd5f6"/><path d="M65 86h9l6 -14 7 31 8 -41 8 38 8 -13h15" fill="none" stroke="#56dcff" stroke-width="3"/><text x="100" y="133" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#eefbff">AMP / PUMP</text></symbol></defs>
<rect width="1600" height="900" fill="#071929"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="20" y="18" width="1560" height="860" rx="16" fill="none" stroke="#288cad" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="60" y="62" font-size="20" letter-spacing="3" fill="#6cdaff" font-weight="bold">THE SOUND QUESTION · VISUAL EXPLAINER</text><text x="60" y="120" font-size="47" fill="#e8f9ff" font-weight="bold">WHY LOW IMPEDANCE CAN BE HARDER ON AN AMP</text><text x="60" y="163" font-size="27" fill="#b0cfe0">Same pump. Same target pressure. Two different tap openings.</text></g>
<path d="M40 192H1560" stroke="#2a6880" stroke-width="2"/>
<rect x="45" y="210" width="1510" height="255" rx="16" fill="#102b3f" stroke="#37738d" stroke-width="2"/>
<rect x="62" y="233" width="362" height="57" rx="10" fill="#113c57" stroke="#56ccf4" stroke-width="2"/><text x="82" y="271" font-family="Arial" font-size="25" fill="#e0f7ff" font-weight="bold">SINK TAP · HIGH IMPEDANCE</text><text x="80" y="327" font-family="Arial" font-size="30" fill="#92e7ff">8 Ω example</text>
<use href="#pump" x="435" y="272" width="230" height="165"/>
<path d="M647 369H1004" stroke="url(#pipe)" stroke-width="25" stroke-linecap="round"/><path d="M718 369l25 -10v20z M827 369l25 -10v20z M936 369l25 -10v20z" fill="#bdf5ff"/>
<path d="M1004 369v-66q0 -22 22 -22h65" stroke="url(#metal)" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M1084 278v77" stroke="#b6e5f4" stroke-width="20"/><path d="M1084 355v49" stroke="url(#water)" stroke-width="15" stroke-linecap="round"/>
<path d="M977 399q105 56 216 0l-21 44q-93 34 -180 0z" fill="#1f5a7d" stroke="#80d6ef" stroke-width="3"/>
<text x="1250" y="300" font-family="Arial" font-size="24" fill="#b6d5e3">CURRENT REQUESTED</text><text x="1250" y="351" font-family="Arial" font-size="53" font-weight="bold" fill="#79edb4">1 A</text><rect x="1251" y="365" width="255" height="24" rx="12" fill="#203a4b" stroke="#8ac9dc"/><rect x="1253" y="367" width="123" height="20" rx="10" fill="#61d6a4"/><text x="1250" y="425" font-family="Arial" font-size="26" font-weight="bold" fill="#7bebb2">PUMP KEEPS UP</text>
<rect x="45" y="485" width="1510" height="260" rx="16" fill="#15283b" stroke="#916251" stroke-width="2"/><rect x="62" y="507" width="362" height="57" rx="10" fill="#312a37" stroke="#e9a872" stroke-width="2"/><text x="82" y="544" font-family="Arial" font-size="25" fill="#fff2e8" font-weight="bold">BATH TAP · LOW IMPEDANCE</text><text x="80" y="600" font-family="Arial" font-size="30" fill="#ffc08a">4 Ω example</text>
