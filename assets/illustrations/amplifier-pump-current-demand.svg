<path d="M1008 647v-54q0 -22 22 -22h75" stroke="url(#metal)" stroke-width="40" fill="none" stroke-linecap="round"/><path d="M1098 571v77" stroke="#b2e1f2" stroke-width="35"/><path d="M1075 649q-5 32 -8 43 M1093 649v44 M1112 649q5 30 9 43" fill="none" stroke="url(#water)" stroke-width="13" opacity=".65"/>
<path d="M964 690q140 58 265 0l-23 40q-100 32 -220 0z" fill="#1f5a7d" stroke="#80d6ef" stroke-width="3"/>
<text x="1250" y="581" font-family="Arial" font-size="24" fill="#b6d5e3">CURRENT REQUESTED</text><text x="1250" y="634" font-family="Arial" font-size="53" font-weight="bold" fill="#ffb17d">2 A</text><rect x="1251" y="650" width="255" height="24" rx="12" fill="#203a4b" stroke="#8ac9dc"/><rect x="1253" y="652" width="251" height="20" rx="10" fill="#ee8969"/><path d="M1442 645v35" stroke="#f7f7e2" stroke-width="5" stroke-dasharray="5 5"/><text x="1250" y="715" font-family="Arial" font-size="24" font-weight="bold" fill="#ffbb8b">DEMAND EXCEEDS LIMIT</text>
<rect x="65" y="771" width="405" height="76" rx="12" fill="#163c51" stroke="#54bbd8" stroke-width="2"/><text x="89" y="805" font-family="Arial" font-size="20" fill="#abdbef" font-weight="bold">EXAMPLE PUMP CAPACITY</text><text x="89" y="838" font-family="Arial" font-size="28" fill="#f4fbff" font-weight="bold">1.5 A at this pressure</text>
<text x="502" y="806" font-family="Arial" font-size="30" fill="#e7f8ff" font-weight="bold">Opening a tap wider increases demand.</text><text x="502" y="844" font-family="Arial" font-size="27" fill="#9bdbf4">It cannot make the pump supply more than its limit.</text></svg>