<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 555" width="1180" height="555" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">The difference between a combined stereo recording and four separate tracks</title><desc id="figdesc">Both examples begin with the same four simultaneous sources. On the left, a generic mixer combines the signals into one stereo pair, left and right; later editing cannot independently adjust the four original sources. On the right, a multitrack-capable interface or mixer records four individual tracks, preserving independent level control later. This is a conceptual illustration, not a claim about every USB mixer.</desc>
<defs>
 <linearGradient id="bg" x2=".7" y2="1"><stop stop-color="#0b2135"/><stop offset=".48" stop-color="#153247"/><stop offset="1" stop-color="#081729"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31536b"/><stop offset=".26" stop-color="#213d53"/><stop offset=".8" stop-color="#12283d"/><stop offset="1" stop-color="#0c1b2c"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9ec6d8"/><stop offset=".3" stop-color="#497088"/><stop offset=".78" stop-color="#162e45"/><stop offset="1" stop-color="#96b6c8"/></linearGradient>
 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#8be4ff"/><stop offset="1" stop-color="#2e98cf"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#789fbc" stroke-opacity=".10"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="3" dy="8" stdDeviation="7" flood-color="#030a13" flood-opacity=".6"/></filter>
</defs><rect width="1180" height="555" rx="20" fill="url(#bg)"/><rect width="1180" height="555" rx="20" fill="url(#grid)"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="30" y="38" fill="#eef9ff" font-size="27" font-weight="800" text-anchor="start">WHAT DOES USB ACTUALLY RECORD?</text><text x="30" y="64" fill="#bdd8e7" font-size="15" font-weight="500" text-anchor="start">The channel count printed on the mixer does not tell you how many independent tracks the computer receives.</text><rect x="22" y="88" width="553" height="430" rx="18" fill="#0b1d2e" stroke="#678ea7" stroke-width="2"/><text x="44" y="125" fill="#b0dfff" font-size="20" font-weight="750" text-anchor="start">A / STEREO USB FEED</text><text x="44" y="151" fill="#bdd5e5" font-size="14" font-weight="500" text-anchor="start">One combined recording in left + right</text><rect x="42" y="183" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M55 188H152" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="104" y="203" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">VOCAL</text><text x="104" y="221" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 1</text><rect x="42" y="251" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M55 256H152" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="104" y="271" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">GUITAR</text><text x="104" y="289" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 2</text><rect x="42" y="319" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M55 324H152" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="104" y="339" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">BASS</text><text x="104" y="357" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 3</text><rect x="42" y="387" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M55 392H152" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="104" y="407" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">DRUMS</text><text x="104" y="425" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 4</text><rect x="229" y="230" width="137" height="150" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M242 235H352" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="297.5" y="262" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">STEREO</text><text x="297.5" y="286" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">USB output</text><rect x="247" y="368" width="101" height="4" rx="2" fill="#8fd9ff" opacity=".8"/><path d="M168 207 L196 207 L196 303 L225 303" fill="none" stroke="#8dd6f7" stroke-width="2" opacity=".84"/><path d="M168 275 L196 275 L196 303 L225 303" fill="none" stroke="#e5c28f" stroke-width="2" opacity=".84"/><path d="M168 343 L196 343 L196 303 L225 303" fill="none" stroke="#8dd6f7" stroke-width="2" opacity=".84"/><path d="M168 411 L196 411 L196 303 L225 303" fill="none" stroke="#e5c28f" stroke-width="2" opacity=".84"/><path d="M369 299L401 299" fill="none" stroke="#90d8fc" stroke-width="3" /><path d="M392 293L401 299L392 305" stroke="#90d8fc" fill="none" stroke-width="3" stroke-linejoin="round"/><rect x="410" y="235" width="142" height="134" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M423 240H538" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="481" y="265" fill="#e8f7ff" font-size="15" font-weight="700" text-anchor="middle">RECORDED</text><text x="481" y="289" fill="#a5dafa" font-size="14" font-weight="650" text-anchor="middle">LEFT + RIGHT</text><path d="M430 323h25l7-14 7 26 8-10 8-18 8 25 8-12h20" fill="none" stroke="#76d4ff" stroke-width="3"/><path d="M430 343h25l7-11 7 12 8-8 8-16 8 18 8-8h20" fill="none" stroke="#efc18a" stroke-width="2"/><text x="42" y="475" fill="#e5f0fc" font-size="15" font-weight="500" text-anchor="start">Change the whole mix later,</text><text x="42" y="495" fill="#e5f0fc" font-size="15" font-weight="500" text-anchor="start">not each original source.</text><rect x="604" y="88" width="553" height="430" rx="18" fill="#0b1d2e" stroke="#66ad9a" stroke-width="2"/><text x="626" y="125" fill="#a1f5d8" font-size="20" font-weight="750" text-anchor="start">B / MULTITRACK USB FEED</text><text x="626" y="151" fill="#bdd5e5" font-size="14" font-weight="500" text-anchor="start">Each source remains on its own track</text><rect x="624" y="183" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M637 188H734" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="686" y="203" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">VOCAL</text><text x="686" y="221" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 1</text><rect x="624" y="251" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M637 256H734" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="686" y="271" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">GUITAR</text><text x="686" y="289" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 2</text><rect x="624" y="319" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M637 324H734" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="686" y="339" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">BASS</text><text x="686" y="357" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 3</text><rect x="624" y="387" width="124" height="48" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M637 392H734" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="686" y="407" fill="#e4f2fc" font-size="14" font-weight="700" text-anchor="middle">DRUMS</text><text x="686" y="425" fill="#b2cddd" font-size="11" font-weight="450" text-anchor="middle">Input 4</text><rect x="811" y="230" width="137" height="150" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M824 235H934" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="879.5" y="262" fill="#f0f9ff" font-size="19" font-weight="750" text-anchor="middle">SEPARATE</text><text x="879.5" y="286" fill="#b8d7e9" font-size="13" font-weight="450" text-anchor="middle">USB tracks</text><rect x="829" y="368" width="101" height="4" rx="2" fill="#9be4c6" opacity=".8"/><path d="M750 207 L778 207 L778 303 L807 303" fill="none" stroke="#8dd6f7" stroke-width="2" opacity=".84"/><path d="M750 275 L778 275 L778 303 L807 303" fill="none" stroke="#e5c28f" stroke-width="2" opacity=".84"/><path d="M750 343 L778 343 L778 303 L807 303" fill="none" stroke="#8dd6f7" stroke-width="2" opacity=".84"/><path d="M750 411 L778 411 L778 303 L807 303" fill="none" stroke="#e5c28f" stroke-width="2" opacity=".84"/><path d="M950 299h26v-90h15M976 299v-32h15M976 299v34h15M976 299v93h15" fill="none" stroke="#83dab9" stroke-width="2.5"/><rect x="992" y="194" width="142" height="45" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M1005 199H1120" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="1062" y="212" fill="#e8f9f2" font-size="14" font-weight="750" text-anchor="middle">TRACK 1</text><path d="M1009 225l10-7 8 10 8-13 10 11 10-8 10 6" stroke="#83d5f2" stroke-width="2" fill="none"/><rect x="992" y="261" width="142" height="45" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M1005 266H1120" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="1062" y="279" fill="#e8f9f2" font-size="14" font-weight="750" text-anchor="middle">TRACK 2</text><path d="M1009 292l10-7 8 10 8-13 10 11 10-8 10 6" stroke="#e9c68e" stroke-width="2" fill="none"/><rect x="992" y="328" width="142" height="45" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M1005 333H1120" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="1062" y="346" fill="#e8f9f2" font-size="14" font-weight="750" text-anchor="middle">TRACK 3</text><path d="M1009 359l10-7 8 10 8-13 10 11 10-8 10 6" stroke="#83d5f2" stroke-width="2" fill="none"/><rect x="992" y="395" width="142" height="45" rx="13" fill="url(#panel)" stroke="#63849a" stroke-width="1.5" filter="url(#shadow)"/><path d="M1005 400H1120" stroke="#a8dafa" opacity=".24" stroke-width="2"/><text x="1062" y="413" fill="#e8f9f2" font-size="14" font-weight="750" text-anchor="middle">TRACK 4</text><path d="M1009 426l10-7 8 10 8-13 10 11 10-8 10 6" stroke="#e9c68e" stroke-width="2" fill="none"/><text x="624" y="475" fill="#e8f9f2" font-size="15" font-weight="500" text-anchor="start">Edit each source separately</text><text x="624" y="495" fill="#e8f9f2" font-size="15" font-weight="500" text-anchor="start">after the performance.</text><text x="26" y="545" fill="#b5cada" font-size="12" font-weight="500" text-anchor="start">BOTH ARE LEGITIMATE • Choose based on editing needs. Input counts and USB channels must be checked separately.</text></g></svg>